# Builds the standalone Windows portable exe and attaches it to a GitHub
# Release, so the app can be downloaded/shared as a file — no build tools
# needed by anyone.
#
# COST NOTE: this workflow runs ONLY on manual dispatch (never on push/PR),
# and this repository is public, so runs consume no paid Actions minutes.
name: Release standalone exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true
        default: v1.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    # 45, not 30: the Layer 5 media suite below spawns real ffmpeg for every
    # case and is markedly slower on a Windows runner than the ~90 s it takes
    # on linux — and it now carries six extra 1080p encodes for the T-51
    # drawtext pixels. The ceiling still only bounds a run that has hung.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (emoji guard + typecheck + unit tests)
        run: npm run verify

      # This runner is the only Windows execution of the test suite
      # (LESSONS 2026-08-15) and the only platform whose bundled ffmpeg has
      # the `drawtext` filter, so the win32-gated watermark / text-overlay
      # pixel tests (T-51) run here or nowhere. `verify` deliberately does
      # not include this suite — it spawns real ffmpeg and takes minutes.
      # No new trigger is added for it: this workflow stays dispatch/tag
      # only, so it carries no new standing Actions cost.
      - name: Real-media suite (Layer 5, incl. the win32-only drawtext pixels)
        run: npm run test:media

      - name: Build portable exe
        run: npm run dist

      - name: Create release with exe attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: imagii ${{ inputs.tag || github.ref_name }}
          files: dist/imagii.exe
          body: |
            Standalone Windows app — no install needed.

            **Download `imagii.exe` below**, put it anywhere, and
            double-click. Windows SmartScreen will warn on first run because
            the file is unsigned: click **More info → Run anyway**.
